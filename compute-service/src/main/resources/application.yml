server:
  port: ${SERVER_PORT:8082}        # HTTP, used only for Actuator

grpc:
  server:
    port: ${GRPC_PORT:9090}
    reflection-service-enabled: true   # lets grpcurl discover services without the .proto

spring:
  application:
    name: compute-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/computedb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

gpuforge:
  simulator:
    seconds-per-epoch: ${SECONDS_PER_EPOCH:2}   # speed of the fake training

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
